<style>
/* Layout: app bar with back link, then one centred column of cards (UI-kit style: zinc neutrals, indigo brand, 12px radius) */
:root {
  --bg: #fafafa; --card: #ffffff; --fg: #09090b; --muted: #71717a; --border: #e4e4e7; --input: #e4e4e7;
  --primary: #18181b; --primary-fg: #fafafa; --secondary: #f4f4f5;
  --brand: #4f46e5; --brand-soft: #eef2ff; --ring: #818cf8;
  --ok: #15803d; --ok-soft: #f0fdf4; --bad: #dc2626; --bad-soft: #fef2f2;
  --m: #2563eb; --m-soft: #eff6ff; --f: #db2777; --f-soft: #fdf2f8; --n: #059669; --n-soft: #ecfdf5; --pl: #7c3aed; --pl-soft: #f5f3ff; --x: #71717a; --x-soft: #f4f4f5;
  --tip-bg: #18181b; --tip-fg: #fafafa;
  --shadow: 0 1px 2px rgba(9, 9, 11, .05), 0 1px 3px rgba(9, 9, 11, .04);
  --radius: 12px;
  --font: "Geist", "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #09090b; --card: #111113; --fg: #fafafa; --muted: #a1a1aa; --border: #27272a; --input: #27272a;
    --primary: #fafafa; --primary-fg: #18181b; --secondary: #1c1c20;
    --brand: #818cf8; --brand-soft: #1e1b4b; --ring: #6366f1;
    --ok: #4ade80; --ok-soft: #052e16; --bad: #f87171; --bad-soft: #2a0f0f;
    --m: #60a5fa; --m-soft: #172554; --f: #f472b6; --f-soft: #3b0a24; --n: #34d399; --n-soft: #022c22; --pl: #a78bfa; --pl-soft: #2e1065; --x: #a1a1aa; --x-soft: #1c1c20;
    --tip-bg: #fafafa; --tip-fg: #09090b;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #09090b; --card: #111113; --fg: #fafafa; --muted: #a1a1aa; --border: #27272a; --input: #27272a;
  --primary: #fafafa; --primary-fg: #18181b; --secondary: #1c1c20;
  --brand: #818cf8; --brand-soft: #1e1b4b; --ring: #6366f1;
  --ok: #4ade80; --ok-soft: #052e16; --bad: #f87171; --bad-soft: #2a0f0f;
  --m: #60a5fa; --m-soft: #172554; --f: #f472b6; --f-soft: #3b0a24; --n: #34d399; --n-soft: #022c22; --pl: #a78bfa; --pl-soft: #2e1065; --x: #a1a1aa; --x-soft: #1c1c20;
  --tip-bg: #fafafa; --tip-fg: #09090b;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
a { color: var(--brand); text-underline-offset: 3px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--bg); }

/* App bar */
.appbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter: saturate(1.5) blur(10px); -webkit-backdrop-filter: saturate(1.5) blur(10px); border-bottom: 1px solid var(--border); }
.appbar-inner { margin: 0; height: 56px; display: flex; align-items: center; gap: 12px; padding-left: max(var(--gutter), env(safe-area-inset-left, 0px)); padding-right: max(var(--gutter), env(safe-area-inset-right, 0px)); }
.crumbs { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: 14px; color: var(--muted); }
.crumbs .cur { color: var(--fg); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.crumbs .sep { opacity: .5; }
.appbar .spacer { flex: 1; }

/* Buttons */
button { font: inherit; cursor: pointer; }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 8px; font-size: 14px; font-weight: 500; border: 1px solid var(--input); background: var(--card); color: var(--fg); text-decoration: none; box-shadow: var(--shadow); white-space: nowrap; }
.btn:hover { background: var(--secondary); }
.btn.primary { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); }
.btn.primary:hover { opacity: .9; background: var(--primary); }
.btn.ghost { border-color: transparent; box-shadow: none; background: transparent; padding: 0 10px; }
.btn.ghost:hover { background: var(--secondary); }
.btn:disabled, .btn.primary:disabled:hover { opacity: .38; cursor: not-allowed; box-shadow: none; }
[hidden] { display: none !important; }
.btn:focus-visible, .opt:focus-visible, summary:focus-visible, a:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }

.wrap { margin: 0; padding-left: max(var(--gutter), env(safe-area-inset-left, 0px)); padding-right: max(var(--gutter), env(safe-area-inset-right, 0px)); padding-block: 32px 80px; display: grid; gap: 28px; }
header.hero { display: grid; gap: 10px; }
.badge { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 500; border: 1px solid var(--border); background: var(--card); color: var(--muted); width: max-content; }
.badge .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--brand); }
h1 { font-size: clamp(28px, 6vw, 40px); line-height: 1.1; letter-spacing: -0.025em; font-weight: 700; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); margin: 0; font-size: 18px; }
.intro { color: var(--muted); margin: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; height: 28px; padding: 0 12px; border-radius: 999px; font-size: 13px; font-weight: 500; background: var(--brand-soft); color: var(--brand); text-decoration: none; }
.tabs { display: flex; gap: 4px; padding: 4px; background: var(--secondary); border-radius: 10px; width: max-content; max-width: 100%; overflow-x: auto; }
.tabs a { padding: 6px 12px; border-radius: 7px; font-size: 14px; font-weight: 500; color: var(--muted); text-decoration: none; white-space: nowrap; }
.tabs a:hover { color: var(--fg); background: var(--card); box-shadow: var(--shadow); }
.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
section { display: grid; gap: 14px; scroll-margin-top: 72px; }
.sec-head { display: grid; gap: 2px; }
h2 { font-size: 20px; letter-spacing: -0.01em; font-weight: 600; margin: 0; display: flex; align-items: center; gap: 10px; }
h2 .num { font-family: var(--mono); font-size: 12px; color: var(--muted); font-weight: 500; border: 1px solid var(--border); border-radius: 6px; padding: 1px 6px; }
.hint { color: var(--muted); font-size: 14px; margin: 0; }
footer { color: var(--muted); font-size: 14px; border-top: 1px solid var(--border); padding-top: 16px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }

/* Quiz (shared) */
.qbar { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 56px); z-index: 20; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; padding: 10px 14px; }
.progress { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 10px; }
.progress strong { color: var(--fg); }
.meter { width: 120px; height: 6px; border-radius: 999px; background: var(--secondary); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--brand); border-radius: 999px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.q { padding: 18px; display: grid; gap: 12px; }
.qhead { display: flex; gap: 12px; align-items: baseline; }
.qnum { font-family: var(--mono); font-size: 12px; color: var(--muted); flex: none; font-variant-numeric: tabular-nums; }
.qtext { font-weight: 600; min-width: 0; }
.qtext em, .explain em { font-style: normal; background: var(--brand-soft); color: var(--fg); padding: 0 5px; border-radius: 5px; }
.opts { display: grid; gap: 8px; }
.opt { display: flex; gap: 12px; align-items: center; text-align: left; border: 1px solid var(--border); background: var(--card); color: var(--fg); border-radius: 10px; padding: 10px 12px; width: 100%; }
.opt:hover { background: var(--secondary); }
.opt .key { font-family: var(--mono); font-size: 12px; width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; border: 1px solid var(--border); color: var(--muted); flex: none; }
.opt .label { min-width: 0; }
.opt.sel { border-color: var(--brand); background: var(--brand-soft); box-shadow: 0 0 0 1px var(--brand) inset; }
.opt.sel .key { background: var(--brand); border-color: var(--brand); color: #fff; }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.right .key { background: var(--ok); border-color: var(--ok); color: var(--card); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .key { background: var(--bad); border-color: var(--bad); color: var(--card); }
.locked .opt { cursor: default; }
.locked .opt:hover { background: inherit; }
.locked .opt.right:hover { background: var(--ok-soft); } .locked .opt.wrong:hover { background: var(--bad-soft); }
.verdict { display: inline-flex; width: max-content; align-items: center; height: 22px; padding: 0 8px; border-radius: 6px; font-size: 12px; font-weight: 600; }
.verdict.ok { color: var(--ok); background: var(--ok-soft); } .verdict.no { color: var(--bad); background: var(--bad-soft); }
.explain { margin: -2px 0 4px 18px; padding: 8px 12px; border-left: 2px solid var(--ok); background: var(--ok-soft); border-radius: 0 8px 8px 0; font-size: 14px; }
.explain p { margin: 0; }
.result { padding: 18px; display: grid; gap: 4px; }
.result h3 { margin: 0; font-size: 22px; letter-spacing: -0.01em; }
.result p { margin: 0; color: var(--muted); }
.note-copy { font-size: 14px; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { .opt, .btn, .tabs a { transition: background .12s, border-color .12s, box-shadow .12s; } }
/* Full-width layout: pages use the whole window, and long words wrap instead of pushing the page sideways */
:root { --gutter: clamp(16px, 3vw, 40px); }
.wrap > *, section > *, .card { min-width: 0; }
body { overflow-wrap: break-word; }
.qtext, .opt .label, .explain, .result, .hero h1, .sub, .intro { overflow-wrap: anywhere; }
/* last quiz result (localStorage) */
.lastres { margin: 0 0 10px; font-size: 14px; font-weight: 500; color: var(--muted); }
.lastres.hi { color: var(--ok); }
.score { display: inline-block; margin-left: 8px; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; font-family: var(--mono); vertical-align: middle; background: var(--secondary); color: var(--muted); }
.score.hi { background: var(--ok-soft); color: var(--ok); }


body { margin: 0; }
/* site switch */
.siteswitch { margin-left: auto; display: flex; gap: 2px; padding: 3px; background: var(--secondary); border-radius: 9px; flex: none; }
.siteswitch a { padding: 4px 10px; border-radius: 6px; font-size: 13px; font-weight: 500; color: var(--muted); text-decoration: none; white-space: nowrap; }
.siteswitch a:hover { color: var(--fg); }
.siteswitch a[aria-current="page"] { background: var(--card); color: var(--fg); box-shadow: var(--shadow); }
@media (max-width: 520px) { .siteswitch .long { display: none; } .crumbs a, .crumbs .sep { display: none; } .crumbs .cur { white-space: nowrap; } }
/* progress */
.score.ok { background: var(--brand-soft); color: var(--brand); }
.pscore { display: inline-flex; align-items: center; gap: 6px; }
.pscore .pbar { width: 40px; background: color-mix(in srgb, currentColor 22%, transparent); }
.pscore .pbar i { background: currentColor; }
.pbar { display: inline-block; width: 64px; height: 5px; border-radius: 999px; background: var(--secondary); overflow: hidden; vertical-align: middle; }
.pbar i { display: block; height: 100%; background: var(--ok); border-radius: 999px; }
.pstatus { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; font-size: 14px; color: var(--muted); }
.pstatus .pbar { width: 140px; height: 6px; }
.pcard { padding: 16px 18px; display: grid; gap: 10px; }
.pcard > .pbar { width: 100%; height: 8px; }
.phead { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px; }
.pnum { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.pgroups { display: grid; gap: 4px 20px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.pgroup { display: grid; grid-template-columns: 1fr 80px 52px; align-items: center; gap: 10px; padding: 4px 0; color: var(--fg); text-decoration: none; font-size: 14px; }
.pgroup .pbar { width: 80px; } .pgroup .pnum { text-align: right; }
.pgroup:hover .pg-t { color: var(--brand); }
.pextra { border-top: 1px solid var(--border); padding-top: 10px; grid-template-columns: 1fr 120px 52px; }
.pextra .pbar { width: 120px; }
.phint { margin: 0; font-size: 12.5px; color: var(--muted); }
/* theme: german */

@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --brand: #f87171; --brand-soft: #3a1515; --ring: #ef4444; --bg: #0f0d0b; --card: #171411; --border: #2e2720; --input: #2e2720; --secondary: #221c17; --primary: #fca5a5; --primary-fg: #1c0a0a; } }
:root[data-theme="dark"] { --brand: #f87171; --brand-soft: #3a1515; --ring: #ef4444; --bg: #0f0d0b; --card: #171411; --border: #2e2720; --input: #2e2720; --secondary: #221c17; --primary: #fca5a5; --primary-fg: #1c0a0a; }
h1, h2, h3, .home-card .t, .result h3, .prose h2, .prose h3 { font-family: var(--serif); letter-spacing: -0.01em; }
h1 { font-weight: 700; }
.badge { border-color: color-mix(in srgb, var(--brand) 30%, var(--border)); color: var(--brand); background: var(--brand-soft); }
.home-card:hover { border-color: var(--brand); box-shadow: 0 4px 14px color-mix(in srgb, var(--brand) 14%, transparent); }
.prose h2 { border-top-color: color-mix(in srgb, var(--brand) 25%, var(--border)); }
.banner { height: clamp(8px, 2.6vw, 40px); overflow: hidden; line-height: 0; border-bottom: 3px solid transparent; border-image: linear-gradient(90deg, #1f1f1f 0 33.4%, #c8102e 33.4% 66.7%, #e0ac00 66.7%) 1; }
.banner svg { display: block; width: 100%; height: 100%; }

:root[data-theme="dark"] .banner .bn-bg { fill: var(--secondary); }

 fill="none" stroke="#1f1f1f" stroke-opacity="0.62" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 20l1-5L16 4l4 4L9 19zM14 6l4 4" transform="translate(1036 4) rotate(1 12 12) scale(0.94)" fill="none" stroke="#1f1f1f" stroke-opacity="0.62" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 9a3 3 0 1 1 4 2.8c-.7.4-1 1-1 1.7V15M12 19h.01" transform="translate(1127 10) rotate(-7 12 12) scale(1.01)" fill="none" stroke="#1f1f1f" stroke-opacity="0.59" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 12l5 5L20 6" transform="translate(1187 7) rotate(-3 12 12) scale(1.03)" fill="none" stroke="#d9a400" stroke-opacity="0.65" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 9a3 3 0 1 1 4 2.8c-.7.4-1 1-1 1.7V15M12 19h.01" transform="translate(1263 9) rotate(3 12 12) scale(1.02)" fill="none" stroke="#c8102e" stroke-opacity="0.53" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 12l5 5L20 6" transform="translate(1319 6) rotate(2 12 12) scale(1.14)" fill="none" stroke="#d9a400" stroke-opacity="0.75" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 20l1-5L16 4l4 4L9 19zM14 6l4 4" transform="translate(1400 11) rotate(-8 12 12) scale(1.32)" fill="none" stroke="#c8102e" stroke-opacity="0.36" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 9a3 3 0 1 1 4 2.8c-.7.4-1 1-1 1.7V15M12 19h.01" transform="translate(1482 6) rotate(-7 12 12) scale(1.34)" fill="none" stroke="#c8102e" stroke-opacity="0.77" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 20l1-5L16 4l4 4L9 19zM14 6l4 4" transform="translate(1548 7) rotate(-8 12 12) scale(0.95)" fill="none" stroke="#d9a400" stroke-opacity="0.43" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>

{"id": "prepositions", "title": "Prepositions quiz", "level": "B1", "doc": {"title": "Prepositions: in, an, auf, vor and the rest", "url": "../docs/prepositions.html"}, "questions": [{"q": "Das Geschenk ist für *___*.", "options": ["dich", "dir", "du", "deiner", "ihm"], "answer": 0, "explain": "*für* always takes Akkusativ: *für mich, dich, ihn, sie, uns, euch*."}, {"q": "Ich lerne schon *___* einem Jahr Deutsch.", "options": ["vor", "seit", "für", "von", "in"], "answer": 1, "explain": "*seit* + Dativ + present tense = something that started in the past and is still going."}, {"q": "Wir gehen trotz *___* Regens spazieren.", "options": ["dem", "des", "den", "der", "das"], "answer": 1, "explain": "*trotz* takes the Genitiv in writing; masculine *des* + noun -s: *trotz des Regens* (in speech: trotz dem Regen, without -s)."}, {"q": "Ich lege das Handy auf *___* Tisch.", "options": ["den", "dem", "der", "die", "des"], "answer": 0, "explain": "*legen* is movement (wohin?), so the two-way *auf* takes Akkusativ: *auf den Tisch*."}, {"q": "Die Flasche *___* schon im Kühlschrank.", "options": ["stellt", "legt", "setzt", "sitzt", "steht"], "answer": 4, "explain": "*stellen* is the action (put, + Akk), *stehen* the result (be standing, + Dat). A bottle is upright, so it *steht*."}, {"q": "Ich *___* schon seit einer Stunde auf dem Sofa.", "options": ["setze", "sitze", "stelle", "lege", "sitzt"], "answer": 1, "explain": "*auf dem Sofa* (Dativ) is location, so you need the be-there verb *sitzen*; *sich setzen* (sit down) goes with Akk: *auf das Sofa*."}, {"q": "Ich fahre morgen *___* Berlin.", "options": ["in", "zu", "zum", "nach", "an"], "answer": 3, "explain": "Cities and countries without an article take *nach* for direction: *nach Berlin*. Never *in Berlin* for a direction."}, {"q": "Im Sommer fahre ich *___* Ukraine.", "options": ["nach", "in der", "in die", "nach der", "zur"], "answer": 2, "explain": "It is *die Ukraine*, a country with an article, so direction is *in* + Akk: *in die Ukraine*. *nach Ukraine* is wrong."}, {"q": "Nach der Arbeit bin ich endlich *___*.", "options": ["zu Hause", "nach Hause", "zum Hause", "in Hause", "bei Hause"], "answer": 0, "explain": "*zu Hause* = location (at home), *nach Hause* = movement (home). *bin* shows location."}, {"q": "Wie sagt man das *___* Deutsch?", "options": ["im", "mit", "an", "für", "auf"], "answer": 4, "explain": "Languages take *auf*: *auf Deutsch, auf Ukrainisch*."}, {"q": "Ich habe ihn *___* zwei Jahren kennengelernt, im Sommer 2024.", "options": ["vor", "seit", "für", "in", "ab"], "answer": 0, "explain": "*vor* + Dativ = ago, a point in the past; *seit* is for something still going on."}, {"q": "Der Kurs beginnt *___* Montag *___* 9 Uhr.", "options": ["im … um", "am … am", "um … am", "an … um", "am … um"], "answer": 4, "explain": "Days take *am* (an dem), clock times take *um*: *am Montag um 9 Uhr*."}, {"q": "Which sentence is correct?", "options": ["Ich wohne im einem Haus am See.", "Ich wohne in einem Haus an See.", "Ich wohne in einem Haus am See.", "Ich wohne in einem Haus ans See.", "Ich wohne in einem Haus im See."], "answer": 2, "explain": "No contraction with *ein* (*in einem*), but *an dem* becomes *am*; at the edge of water is *an* + Dativ: *am See*."}, {"q": "Ich warte schon zehn Minuten *___* den Bus.", "options": ["für", "an", "nach", "um", "auf"], "answer": 4, "explain": "*warten auf* + Akk is fixed. English *wait for* misleads: never *warten für*."}, {"q": "Ich freue mich schon *___* das Wochenende nächste Woche.", "options": ["über", "an", "auf", "für", "von"], "answer": 2, "explain": "*sich freuen auf* = look forward to something in the future; *sich freuen über* = be happy about something now or past."}, {"q": "Mein Sohn hat Angst *___* dem Hund.", "options": ["von", "für", "über", "vor", "auf"], "answer": 3, "explain": "*Angst haben vor* + Dativ is fixed."}, {"q": "Sie ist seit fünf Jahren *___* einem Arzt verheiratet.", "options": ["zu", "an", "bei", "mit", "von"], "answer": 3, "explain": "*verheiratet mit* + Dativ. English *married to* misleads: never *verheiratet zu*."}, {"q": "Interessierst du dich für Fußball? – Ja, ich interessiere mich sehr *___*.", "options": ["für ihn", "dafür", "für es", "wofür", "darüber"], "answer": 1, "explain": "For things, German replaces preposition + pronoun with *da-* + preposition: *für* + it = *dafür*."}, {"q": "Wartest du auf Anna? – Ja, ich warte *___*.", "options": ["darauf", "auf ihr", "auf sie", "worauf", "auf ihn"], "answer": 2, "explain": "For people, keep the preposition + pronoun: *auf* takes Akk, Anna = *sie*: *auf sie*. da-compounds are only for things."}, {"q": "*___* denkst du gerade? – An meinen Urlaub.", "options": ["Worauf", "Wovon", "Daran", "Woran", "An wen"], "answer": 3, "explain": "The answer is a thing (*an meinen Urlaub*), so the question is *wo(r)-* + preposition: *an* → *woran*. *An wen* asks about a person."}, {"q": "Ich gehe heute Abend *___* Anna.", "options": ["zu", "bei", "nach", "an", "in"], "answer": 0, "explain": "Going to a person is *zu* + Dativ; *bei Anna* is being at her place."}, {"q": "Wir hängen das Bild *___* Wand.", "options": ["an der", "an die", "auf die", "auf der", "in die"], "answer": 1, "explain": "A wall is a vertical surface, so *an*; hanging it up is movement (wohin?), so Akk: *an die Wand*."}, {"q": "Gestern *___* der Mantel noch am Haken.", "options": ["hängte", "legte", "hing", "steckte", "stellte"], "answer": 2, "explain": "Being there is the strong verb *hängen – hing – gehangen*; *hängte* is the past of putting something up."}, {"q": "Im Urlaub liegen wir den ganzen Tag *___* Strand.", "options": ["ans", "an den", "im", "am", "zum"], "answer": 3, "explain": "Water and coast take *an*; lying there is location (wo?), so Dativ: *an dem* → *am Strand*."}, {"q": "Wir fahren *___* Mai in den Urlaub.", "options": ["am", "um", "in", "an", "im"], "answer": 4, "explain": "Months and seasons take *im* (in dem): *im Mai, im Sommer*; *am* is for days and dates."}, {"q": "Which sentence is correct standard German?", "options": ["Ich bin im Jahr 2020 umgezogen.", "Ich bin in 2020 umgezogen.", "Ich bin am 2020 umgezogen.", "Ich bin im 2020 umgezogen.", "Ich bin an 2020 umgezogen."], "answer": 0, "explain": "A year takes no preposition (*2020*) or *im Jahr 2020*; *in 2020* is an anglicism."}, {"q": "Ich schlafe *___* Nacht oft schlecht.", "options": ["am", "in der", "an der", "im", "um die"], "answer": 1, "explain": "Parts of the day take *am* (am Morgen, am Abend), but *Nacht* is the exception: *in der Nacht*."}, {"q": "Die Prüfung ist *___* zwei Tagen. Ich muss noch lernen.", "options": ["nach", "vor", "in", "seit", "für"], "answer": 2, "explain": "*in* + Dativ = in two days from now; *vor* would be ago, *seit* still going."}, {"q": "Ich fahre jeden Morgen mit dem Rad *___* Arbeit.", "options": ["zum", "zu die", "nach", "zur", "bei der"], "answer": 3, "explain": "*zu* + Dativ, and Arbeit is feminine: *zu der* → *zur Arbeit*, the only standard contraction with *der*."}, {"q": "Ich bin sehr stolz *___* meinen Sohn.", "options": ["von", "über", "für", "an", "auf"], "answer": 4, "explain": "*stolz auf* + Akk is fixed. English *proud of* misleads: never *stolz von*."}, {"q": "Nächste Woche nehme ich *___* einem Deutschkurs teil.", "options": ["an", "in", "bei", "auf", "zu"], "answer": 0, "explain": "*teilnehmen an* + Dativ is fixed: *an einem Kurs*, or *am Kurs*."}, {"q": "Ob wir grillen, hängt *___* Wetter ab.", "options": ["am", "vom", "auf das", "beim", "nach dem"], "answer": 1, "explain": "*abhängen von* + Dativ; *von dem* contracts to *vom Wetter*."}, {"q": "Wer kümmert sich *___* die Kinder?", "options": ["für", "über", "um", "nach", "an"], "answer": 2, "explain": "*sich kümmern um* + Akk is fixed. *sorgen für* means something similar, but *kümmern* needs *um*."}, {"q": "*___* hast du Angst? – Vor meinem neuen Chef.", "options": ["Wovor", "Vor wen", "Wovon", "Vor wem", "Vor was"], "answer": 3, "explain": "The answer is a person, so keep preposition + question word; *vor* takes Dativ: *vor wem*. *Wovor* asks about a thing."}, {"q": "Ich habe Angst *___*, allein zu sein.", "options": ["vor es", "dafür", "darauf", "wovor", "davor"], "answer": 4, "explain": "*Angst haben vor* + a thing or idea becomes *davor*, which points forward to the zu-infinitive. *vor es* is wrong."}, {"q": "Er kommt ohne *___* Frau zur Party.", "options": ["seine", "seiner", "seinem", "seinen", "sein"], "answer": 0, "explain": "*ohne* always takes Akkusativ; feminine Akk is *seine Frau*."}, {"q": "Außer *___* hat niemand angerufen.", "options": ["mich", "mir", "ich", "meiner", "mein"], "answer": 1, "explain": "*außer* (except) always takes Dativ: *außer mir, außer dir*."}, {"q": "*___* des Urlaubs habe ich viel gelesen.", "options": ["Seit", "Nach", "Während", "Ab", "Bei"], "answer": 2, "explain": "*des Urlaubs* is Genitiv, and of these only *während* (during) takes the Genitiv; the others need Dativ (*seit dem Urlaub*)."}, {"q": "Der Laden ist *___* 9 *___* 18 Uhr geöffnet.", "options": ["von … zu", "seit … bis", "um … bis", "von … bis", "am … bis"], "answer": 3, "explain": "A time span from start to end is *von … bis*: *von 9 bis 18 Uhr*."}, {"q": "Sie wohnt noch *___* ihren Eltern, in ihrem alten Kinderzimmer.", "options": ["zu", "nach", "an", "aus", "bei"], "answer": 4, "explain": "Living at someone's place is *bei* + Dativ; *zu* would be movement to them."}]}
</script>
<script>
(function () {
  var data = JSON.parse(document.getElementById('quiz-data').textContent);
  var KEYS = ['A', 'B', 'C', 'D', 'E'];
  function L(o, k) { return o[k]; }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  // Allows *word* in question text to mark the gap or key word
  function rich(node, text) {
    String(text).split(/(\*[^*]+\*)/).forEach(function (part) {
      if (/^\*[^*]+\*$/.test(part)) node.appendChild(el('em', null, part.slice(1, -1)));
      else if (part) node.appendChild(document.createTextNode(part));
    });
    return node;
  }

  var total = data.questions.length;
  // Last result per page, kept in this browser only (key: the page's fixed id)
  var PID = (document.querySelector('meta[name="page-id"]') || {}).content;
  function loadRes() { try { return PID ? JSON.parse(localStorage.getItem('quiz:' + PID) || 'null') : null; } catch (e) { return null; } }
  function saveRes(s, t) { try { if (PID) localStorage.setItem('quiz:' + PID, JSON.stringify({ score: s, total: t, at: Date.now() })); } catch (e) {} showLast(); }
  function showLast() {
    var r = loadRes(), qb = document.querySelector('#quiz .qbar'); if (!qb) return;
    var p = document.getElementById('lastres');
    if (!p) { p = document.createElement('p'); p.id = 'lastres'; p.className = 'lastres'; qb.parentNode.insertBefore(p, qb); }
    if (!r || !r.total) { p.hidden = true; return; }
    var pct = r.score / r.total;
    p.hidden = false; p.className = 'lastres' + (pct >= 0.9 ? ' hi' : '');
    p.textContent = 'Last result: ' + (pct >= 0.9 ? '✓ ' : '') + r.score + '/' + r.total + ' · ' + new Date(r.at).toLocaleDateString();
  }
  showLast();
  // Standalone quiz pages fill their own header; a quiz embedded in a topic page has none
  if (document.getElementById('eyebrow')) {
    document.getElementById('eyebrow').appendChild(document.createTextNode(data.level + ' · ' + total + ' questions'));
    document.getElementById('title').textContent = L(data, 'title');
    document.getElementById('crumb').textContent = L(data, 'title');
    var dl = document.getElementById('doclink');
    if (data.doc && data.doc.url) dl.href = data.doc.url; else dl.hidden = true;
    var intro = document.getElementById('intro');
    intro.textContent = 'Answer every question, then press Check answers. Reloading the page starts over.';
    if (data.doc && data.doc.url) {
      intro.appendChild(document.createTextNode(' Based on '));
      var a = el('a', null, L(data.doc, 'title')); a.href = data.doc.url; 
      intro.appendChild(a); intro.appendChild(document.createTextNode('.'));
    }
  }

  // State lives only in memory: reloading the page starts the quiz fresh
  var state = { answers: {}, checked: false };
  var qWrap = document.getElementById('questions');
  function score() { return data.questions.filter(function (q, i) { return state.answers[i] === q.answer; }).length; }
  function render() {
    qWrap.innerHTML = '';
    data.questions.forEach(function (q, i) {
      var card = el('article', 'q card' + (state.checked ? ' locked' : ''));
      var head = el('div', 'qhead');
      head.appendChild(el('span', 'qnum', String(i + 1).padStart(2, '0')));
      head.appendChild(rich(el('div', 'qtext'), L(q, 'q')));
      card.appendChild(head);
      if (state.checked) {
        var ok = state.answers[i] === q.answer;
        card.appendChild(el('span', 'verdict ' + (ok ? 'ok' : 'no'), ok ? 'Correct' : 'Wrong · answer ' + KEYS[q.answer]));
      }
      var opts = el('div', 'opts'); opts.setAttribute('role', 'radiogroup');
      L(q, 'options').forEach(function (o, j) {
        var b = el('button', 'opt'); b.type = 'button'; b.id = 'q' + i + 'o' + j;
        b.setAttribute('role', 'radio'); b.setAttribute('aria-checked', state.answers[i] === j ? 'true' : 'false');
        b.appendChild(el('span', 'key', KEYS[j])); b.appendChild(el('span', 'label', o));
        if (state.checked) {
          if (j === q.answer) b.classList.add('right'); else if (state.answers[i] === j) b.classList.add('wrong');
        } else {
          if (state.answers[i] === j) b.classList.add('sel');
          b.addEventListener('click', function () { state.answers[i] = j; render(); });
        }
        opts.appendChild(b);
        // After checking, the explanation sits directly under the correct option
        if (state.checked && j === q.answer) { var ex = el('div', 'explain'); ex.appendChild(rich(el('p'), L(q, 'explain'))); opts.appendChild(ex); }
      });
      card.appendChild(opts);
      qWrap.appendChild(card);
    });
    var answered = Object.keys(state.answers).length;
    var prog = document.getElementById('progress'), res = document.getElementById('result'), meter = document.getElementById('meter');
    if (state.checked) {
      var s = score();
      prog.innerHTML = 'Score' + ' <strong>' + s + ' / ' + total + '</strong>';
      meter.style.width = (100 * s / total) + '%';
      res.hidden = false; res.innerHTML = '';
      res.appendChild(el('h3', null, s + ' of ' + total + ' correct'));
      var pct = s / total;
      res.appendChild(el('p', null, pct >= 0.9 ? 'Solid. This topic is ready to move on from.' : pct >= 0.7 ? 'Good. Read the explanations under the ones you missed.' : 'Worth another pass through the topic, then try again.'));
    } else {
      prog.innerHTML = 'Answered' + ' <strong>' + answered + ' / ' + total + '</strong>';
      meter.style.width = (100 * answered / total) + '%';
      res.hidden = true;
    }
    document.getElementById('check').disabled = state.checked || answered < total;
    document.getElementById('copy').hidden = !state.checked;
  }

  document.getElementById('check').addEventListener('click', function () { state.checked = true; render(); saveRes(score(), total); var qs = document.getElementById('quiz'); if (qs && qs.hasAttribute('data-embedded')) qs.scrollIntoView(); else window.scrollTo({ top: 0 }); });
  document.getElementById('reset').addEventListener('click', function () { state = { answers: {}, checked: false }; document.getElementById('copynote').hidden = true; render(); });
  document.getElementById('copy').addEventListener('click', function () {
    var lines = ['Test: ' + L(data, 'title') + ' — ' + score() + '/' + total];
    data.questions.forEach(function (q, i) {
      var mine = state.answers[i];
      if (mine !== q.answer) var op = L(q, 'options'); lines.push('Q' + (i + 1) + ': chose ' + (mine === undefined ? '—' : KEYS[mine] + ' (' + op[mine] + ')') + ', correct ' + KEYS[q.answer] + ' (' + op[q.answer] + ')');
    });
    var text = lines.join('\n'), note = document.getElementById('copynote');
    function fallback() { note.hidden = false; note.textContent = text; note.style.whiteSpace = 'pre-wrap'; }
    try {
      navigator.clipboard.writeText(text).then(function () { note.hidden = false; note.textContent = 'Copied. Paste it anywhere to keep a record of your mistakes.'; }, fallback);
    } catch (e) { fallback(); }
  });
  render();
})();

</script>
<script src="../progress-manifest.js"></script><script src="../progress.js" data-root="../"></script>
