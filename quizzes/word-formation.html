<!doctype html>
<html lang="en">
<head>

<title>Word formation quiz · German library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500;600&display=swap">
<style>
/* Layout: app bar with back link, then one centred column of cards (UI-kit style: zinc neutrals, indigo brand, 12px radius) */
:root {
  --bg: #fafafa; --card: #ffffff; --fg: #09090b; --muted: #71717a; --border: #e4e4e7; --input: #e4e4e7;
  --primary: #18181b; --primary-fg: #fafafa; --secondary: #f4f4f5;
  --brand: #4f46e5; --brand-soft: #eef2ff; --ring: #818cf8;
  --ok: #15803d; --ok-soft: #f0fdf4; --bad: #dc2626; --bad-soft: #fef2f2;
  --m: #2563eb; --m-soft: #eff6ff; --f: #db2777; --f-soft: #fdf2f8; --n: #059669; --n-soft: #ecfdf5; --pl: #7c3aed; --pl-soft: #f5f3ff; --x: #71717a; --x-soft: #f4f4f5;
  --tip-bg: #18181b; --tip-fg: #fafafa;
  --shadow: 0 1px 2px rgba(9, 9, 11, .05), 0 1px 3px rgba(9, 9, 11, .04);
  --radius: 12px;
  --font: "Geist", "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #09090b; --card: #111113; --fg: #fafafa; --muted: #a1a1aa; --border: #27272a; --input: #27272a;
    --primary: #fafafa; --primary-fg: #18181b; --secondary: #1c1c20;
    --brand: #818cf8; --brand-soft: #1e1b4b; --ring: #6366f1;
    --ok: #4ade80; --ok-soft: #052e16; --bad: #f87171; --bad-soft: #2a0f0f;
    --m: #60a5fa; --m-soft: #172554; --f: #f472b6; --f-soft: #3b0a24; --n: #34d399; --n-soft: #022c22; --pl: #a78bfa; --pl-soft: #2e1065; --x: #a1a1aa; --x-soft: #1c1c20;
    --tip-bg: #fafafa; --tip-fg: #09090b;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #09090b; --card: #111113; --fg: #fafafa; --muted: #a1a1aa; --border: #27272a; --input: #27272a;
  --primary: #fafafa; --primary-fg: #18181b; --secondary: #1c1c20;
  --brand: #818cf8; --brand-soft: #1e1b4b; --ring: #6366f1;
  --ok: #4ade80; --ok-soft: #052e16; --bad: #f87171; --bad-soft: #2a0f0f;
  --m: #60a5fa; --m-soft: #172554; --f: #f472b6; --f-soft: #3b0a24; --n: #34d399; --n-soft: #022c22; --pl: #a78bfa; --pl-soft: #2e1065; --x: #a1a1aa; --x-soft: #1c1c20;
  --tip-bg: #fafafa; --tip-fg: #09090b;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
a { color: var(--brand); text-underline-offset: 3px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--bg); }

/* App bar */
.appbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter: saturate(1.5) blur(10px); -webkit-backdrop-filter: saturate(1.5) blur(10px); border-bottom: 1px solid var(--border); }
.appbar-inner { margin: 0; height: 56px; display: flex; align-items: center; gap: 12px; padding-left: max(var(--gutter), env(safe-area-inset-left, 0px)); padding-right: max(var(--gutter), env(safe-area-inset-right, 0px)); }
.crumbs { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: 14px; color: var(--muted); }
.crumbs .cur { color: var(--fg); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.crumbs .sep { opacity: .5; }
.appbar .spacer { flex: 1; }

/* Buttons */
button { font: inherit; cursor: pointer; }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 8px; font-size: 14px; font-weight: 500; border: 1px solid var(--input); background: var(--card); color: var(--fg); text-decoration: none; box-shadow: var(--shadow); white-space: nowrap; }
.btn:hover { background: var(--secondary); }
.btn.primary { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); }
.btn.primary:hover { opacity: .9; background: var(--primary); }
.btn.ghost { border-color: transparent; box-shadow: none; background: transparent; padding: 0 10px; }
.btn.ghost:hover { background: var(--secondary); }
.btn:disabled, .btn.primary:disabled:hover { opacity: .38; cursor: not-allowed; box-shadow: none; }
[hidden] { display: none !important; }
.btn:focus-visible, .opt:focus-visible, summary:focus-visible, a:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }

.wrap { margin: 0; padding-left: max(var(--gutter), env(safe-area-inset-left, 0px)); padding-right: max(var(--gutter), env(safe-area-inset-right, 0px)); padding-block: 32px 80px; display: grid; gap: 28px; }
header.hero { display: grid; gap: 10px; }
.badge { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 500; border: 1px solid var(--border); background: var(--card); color: var(--muted); width: max-content; }
.badge .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--brand); }
h1 { font-size: clamp(28px, 6vw, 40px); line-height: 1.1; letter-spacing: -0.025em; font-weight: 700; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); margin: 0; font-size: 18px; }
.intro { color: var(--muted); margin: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; height: 28px; padding: 0 12px; border-radius: 999px; font-size: 13px; font-weight: 500; background: var(--brand-soft); color: var(--brand); text-decoration: none; }
.tabs { display: flex; gap: 4px; padding: 4px; background: var(--secondary); border-radius: 10px; width: max-content; max-width: 100%; overflow-x: auto; }
.tabs a { padding: 6px 12px; border-radius: 7px; font-size: 14px; font-weight: 500; color: var(--muted); text-decoration: none; white-space: nowrap; }
.tabs a:hover { color: var(--fg); background: var(--card); box-shadow: var(--shadow); }
.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
section { display: grid; gap: 14px; scroll-margin-top: 72px; }
.sec-head { display: grid; gap: 2px; }
h2 { font-size: 20px; letter-spacing: -0.01em; font-weight: 600; margin: 0; display: flex; align-items: center; gap: 10px; }
h2 .num { font-family: var(--mono); font-size: 12px; color: var(--muted); font-weight: 500; border: 1px solid var(--border); border-radius: 6px; padding: 1px 6px; }
.hint { color: var(--muted); font-size: 14px; margin: 0; }
footer { color: var(--muted); font-size: 14px; border-top: 1px solid var(--border); padding-top: 16px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }

/* Quiz (shared) */
.qbar { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 56px); z-index: 20; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; padding: 10px 14px; }
.progress { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 10px; }
.progress strong { color: var(--fg); }
.meter { width: 120px; height: 6px; border-radius: 999px; background: var(--secondary); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--brand); border-radius: 999px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.q { padding: 18px; display: grid; gap: 12px; }
.qhead { display: flex; gap: 12px; align-items: baseline; }
.qnum { font-family: var(--mono); font-size: 12px; color: var(--muted); flex: none; font-variant-numeric: tabular-nums; }
.qtext { font-weight: 600; min-width: 0; }
.qtext em, .explain em { font-style: normal; background: var(--brand-soft); color: var(--fg); padding: 0 5px; border-radius: 5px; }
.opts { display: grid; gap: 8px; }
.opt { display: flex; gap: 12px; align-items: center; text-align: left; border: 1px solid var(--border); background: var(--card); color: var(--fg); border-radius: 10px; padding: 10px 12px; width: 100%; }
.opt:hover { background: var(--secondary); }
.opt .key { font-family: var(--mono); font-size: 12px; width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; border: 1px solid var(--border); color: var(--muted); flex: none; }
.opt .label { min-width: 0; }
.opt.sel { border-color: var(--brand); background: var(--brand-soft); box-shadow: 0 0 0 1px var(--brand) inset; }
.opt.sel .key { background: var(--brand); border-color: var(--brand); color: #fff; }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.right .key { background: var(--ok); border-color: var(--ok); color: var(--card); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .key { background: var(--bad); border-color: var(--bad); color: var(--card); }
.locked .opt { cursor: default; }
.locked .opt:hover { background: inherit; }
.locked .opt.right:hover { background: var(--ok-soft); } .locked .opt.wrong:hover { background: var(--bad-soft); }
.verdict { display: inline-flex; width: max-content; align-items: center; height: 22px; padding: 0 8px; border-radius: 6px; font-size: 12px; font-weight: 600; }
.verdict.ok { color: var(--ok); background: var(--ok-soft); } .verdict.no { color: var(--bad); background: var(--bad-soft); }
.explain { margin: -2px 0 4px 18px; padding: 8px 12px; border-left: 2px solid var(--ok); background: var(--ok-soft); border-radius: 0 8px 8px 0; font-size: 14px; }
.explain p { margin: 0; }
.result { padding: 18px; display: grid; gap: 4px; }
.result h3 { margin: 0; font-size: 22px; letter-spacing: -0.01em; }
.result p { margin: 0; color: var(--muted); }
.note-copy { font-size: 14px; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { .opt, .btn, .tabs a { transition: background .12s, border-color .12s, box-shadow .12s; } }
/* Full-width layout: pages use the whole window, and long words wrap instead of pushing the page sideways */
:root { --gutter: clamp(16px, 3vw, 40px); }
.wrap > *, section > *, .card { min-width: 0; }
body { overflow-wrap: break-word; }
.qtext, .opt .label, .explain, .result, .hero h1, .sub, .intro { overflow-wrap: anywhere; }


body { margin: 0; }
</style>
</head>
<body>
<div class="appbar"><div class="appbar-inner">
  <a class="btn ghost" href="../index.html" aria-label="Back to the main page">← Main page</a>
  <div class="crumbs hide-sm"><span class="sep">/</span><span class="hide-sm">Quizzes</span><span class="sep hide-sm">/</span><span class="cur" id="crumb"></span></div>
  <div class="spacer"></div>
  <a class="btn hide-sm" id="doclink" target="_blank" rel="noopener">Open the doc</a>
</div></div>

<div class="wrap">
  <header class="hero">
    <span class="badge" id="eyebrow"><span class="dot"></span></span>
    <h1 id="title"></h1>
    <p class="intro" id="intro"></p>
  </header>

  <section id="quiz">
    <div class="qbar card">
      <div class="progress"><span id="progress"></span><span class="meter"><i id="meter"></i></span></div>
      <div class="actions">
        <button class="btn primary" id="check" type="button">Check answers</button>
        <button class="btn" id="copy" type="button" hidden>Copy results</button>
        <button class="btn" id="reset" type="button">Start over</button>
      </div>
    </div>
    <p class="note-copy" id="copynote" hidden></p>
    <div class="result card" id="result" hidden aria-live="polite"></div>
    <div id="questions" style="display:grid;gap:12px"></div>
  </section>

  <footer><span>Part of the German library</span><a class="btn" href="../index.html">← Back to the main page</a></footer>
</div>
<script type="application/json" id="quiz-data">
{"id": "word-formation", "title": "Word formation quiz", "level": "B1", "doc": {"title": "Word formation: roots and suffixes", "url": "../docs/word-formation.html"}, "questions": [{"q": "Which noun has the *wrong* article?", "options": ["die Gesellschaft", "der Optimismus", "die Lehrling", "das Zeugnis", "die Fähigkeit"], "answer": 2, "explain": "*-ling* is always der: *der Lehrling*. -schaft and -keit are die, -ismus is der, -nis is mostly das."}, {"q": "You are talking about a woman. Which sentence is correct?", "options": ["Sie ist mein Liebling.", "Sie ist meine Liebling.", "Sie ist meine Lieblingin.", "Sie ist mein Lieblinge.", "Sie ist meinen Liebling."], "answer": 0, "explain": "*-ling* nouns are der for everyone and have no -in form: *Sie ist mein Liebling*."}, {"q": "Make a noun from *möglich*.", "options": ["die Möglichheit", "die Möglichkeit", "die Möglichung", "das Möglichnis", "die Möglichschaft"], "answer": 1, "explain": "After -lich, -ig, -bar, -sam the suffix is *-keit*: möglich → *die Möglichkeit*, freundlich → die Freundlichkeit."}, {"q": "What is the female form of *der Arzt*?", "options": ["die Ärzterin", "die Arztin", "die Arzte", "die Ärztin", "die Arztinne"], "answer": 3, "explain": "Add *-in*; some short words also take umlaut: *der Arzt → die Ärztin*, der Koch → die Köchin."}, {"q": "A person who makes art (die Kunst) is …", "options": ["der Kunster", "der Kunstist", "der Kunstling", "der Künster", "der Künstler"], "answer": 4, "explain": "*-ler* makes person nouns from nouns: Kunst → *der Künstler*, Sport → der Sportler, Wissenschaft → der Wissenschaftler."}, {"q": "A person who works in politics (die Politik) is …", "options": ["der Politiker", "der Politist", "der Politer", "der Politikant", "der Politikler"], "answer": 0, "explain": "*-ik* nouns pair with *-iker* persons: Politik → *der Politiker*, Musik → der Musiker, Technik → der Techniker."}, {"q": "Ich helfe dem *___*.", "options": ["Tourist", "Touristem", "Touristes", "Touristens", "Touristen"], "answer": 4, "explain": "*-ist* nouns are weak: -en in every case except Nominativ singular, so *dem Touristen*."}, {"q": "A mushroom you can eat is …", "options": ["essbar", "esslos", "essig", "esslich", "essvoll"], "answer": 0, "explain": "Verb stem + *-bar* = can be done (English -able): *essbar* = edible, trinkbar, machbar. Der Essig is vinegar."}, {"q": "Someone who has no hope at all is …", "options": ["hoffnunglos", "hoffbar", "hoffnungsvoll", "hoffnungslos", "hoffnungsbar"], "answer": 3, "explain": "*-los* = without (Ukrainian без-), and after -ung a linking -s- appears: *hoffnungslos*. Its opposite is hoffnungsvoll."}, {"q": "He is 40 and throws a tantrum like a five-year-old. His behaviour is …", "options": ["kindlich", "kindisch", "kinderlich", "kinderisch", "kindig"], "answer": 1, "explain": "*kindisch* = childish (negative); *kindlich* = childlike (neutral, often positive). -isch on a person-noun often sounds critical."}, {"q": "The conference takes place every three years: eine *___* Konferenz.", "options": ["dreijährige", "dreijahrige", "dreijährlich", "dreitägliche", "dreijährliche"], "answer": 4, "explain": "*-jährlich* = every … years: *dreijährlich*, with the adjective ending *-e* after eine. *dreijährig* = three years old or lasting three years."}, {"q": "Ich habe das Fahrrad *___*.", "options": ["gerepariert", "reparierte", "repariert", "gereparieren", "gerepariet"], "answer": 2, "explain": "*-ieren* verbs take no ge- in the participle: *Ich habe repariert*, telefoniert, studiert."}, {"q": "Make a verb from *kurz* (to shorten).", "options": ["kurzen", "verkurzen", "kürzern", "kürzen", "kurzieren"], "answer": 3, "explain": "Adjective + umlaut + -en makes a verb: kurz → *kürzen*, warm → wärmen, stark → stärken."}, {"q": "Kannst du bis zehn *___*?", "options": ["zahlen", "zählen", "bezahlen", "erzählen", "zahlieren"], "answer": 1, "explain": "From die Zahl come two verbs: *zählen* = to count, *zahlen* = to pay."}, {"q": "*___* Kochen höre ich immer Musik.", "options": ["Bei", "Zu", "Beim", "Im", "Am"], "answer": 2, "explain": "*beim* + infinitive noun = while / during: *beim Kochen*, beim Essen, beim Lernen."}, {"q": "Das ist Papier *___* Schreiben.", "options": ["zur", "zum", "beim", "zu", "am"], "answer": 1, "explain": "*zum* + infinitive noun = for (the purpose of): Papier *zum Schreiben*, eine Brille zum Lesen. The noun is das Schreiben, so zum, not zur."}, {"q": "Which compound has the correct article (die Tür + das Schloss)?", "options": ["der Türschloss", "die Türschloss", "das Türschloss", "das Türeschloss", "die Türenschloss"], "answer": 2, "explain": "The last part decides the gender: *das Schloss* → *das Türschloss*. Compare das Haus + die Tür = die Haustür."}, {"q": "Which compound is spelled correctly?", "options": ["das Arbeitszimmer", "die Wohnungtür", "die Straßebahn", "das Kindszimmer", "die Sonnebrille"], "answer": 0, "explain": "Linking letters: *-s-* after die Arbeit and after -ung (*Arbeitszimmer*, Wohnungstür); *-n-* after feminines in -e (Straßenbahn, Sonnenbrille); *-er-* where the plural is -er (Kinderzimmer)."}, {"q": "Which word does *not* belong to the family of *fahren*?", "options": ["die Fähre", "die Gefahr", "die Erfahrung", "das Fahrzeug", "die Vorfahrt"], "answer": 1, "explain": "*die Gefahr* (danger) only looks similar: it is not built from the verb *fahren* (it is related to English *fear*). Fähre, Erfahrung, Fahrzeug and Vorfahrt all come from fahren."}, {"q": "Die Reise nach Japan war ein tolles *___*.", "options": ["Erfahrung", "Lebewesen", "Erlebung", "Erlebnis", "Lebenslauf"], "answer": 3, "explain": "*das Erlebnis* = one thing that happened to you (враження, пригода); *die Erfahrung* = know-how gained over time (досвід), and it is feminine, so it cannot follow ein tolles."}, {"q": "Morgen um zehn haben wir eine *___* mit dem Chef (a work meeting).", "options": ["Besprechung", "Aussprache", "Versprechen", "Widerspruch", "Anspruch"], "answer": 0, "explain": "*besprechen* = to discuss, so *die Besprechung* = a meeting at work. Aussprache = pronunciation, Versprechen = promise, Widerspruch = contradiction, Anspruch = claim."}, {"q": "Nächsten Monat ziehen wir nach Hamburg *___*.", "options": ["an", "aus", "vor", "ab", "um"], "answer": 4, "explain": "*umziehen* = to move house: *Wir ziehen nach Hamburg um* (der Umzug). ausziehen = move out of a flat or take off clothes; anziehen = put on."}, {"q": "Wer ist hier *___* für die Visa?", "options": ["ständig", "anständig", "zuständig", "selbstständig", "verständlich"], "answer": 2, "explain": "*zuständig für* = responsible for, in charge of. ständig = constantly, anständig = decent, selbstständig = independent, verständlich = understandable."}, {"q": "Meiner *___* nach ist das falsch.", "options": ["Aussicht", "Absicht", "Vorsicht", "Ansicht", "Rücksicht"], "answer": 3, "explain": "*meiner Ansicht nach* = in my opinion (die Ansicht = opinion). Aussicht = view, Absicht = intention, Vorsicht = caution, Rücksicht = consideration."}, {"q": "Ich habe im Urlaub zwei Kilo *___* (lost weight).", "options": ["zugenommen", "abgenommen", "angenommen", "aufgenommen", "teilgenommen"], "answer": 1, "explain": "*abnehmen* = to lose weight, *zunehmen* = to gain weight. annehmen = accept, aufnehmen = record, teilnehmen = take part."}, {"q": "What does *das Gift* mean?", "options": ["poison", "gift, present", "talent", "task", "result"], "answer": 0, "explain": "False friend: *das Gift* = poison (an old noun from geben). A present is das Geschenk; die Gabe = gift, talent."}, {"q": "Which of these nouns is masculine (*der*)?", "options": ["Fahrt", "Sprache", "Gespräch", "Besuch", "Gabe"], "answer": 3, "explain": "Nouns made from a bare verb stem are mostly der: *der Besuch*, der Kauf, der Schlaf. die Fahrt, die Sprache, die Gabe; das Gespräch is a Ge- noun."}, {"q": "Which *-er* noun is *not* masculine?", "options": ["Fahrer", "Wecker", "Drucker", "Computer", "Fenster"], "answer": 4, "explain": "-er is reliably der only for a person or device that does something (der Fahrer, der Wecker, der Drucker, der Computer). *das Fenster* is not an agent, so the ending tells you nothing."}, {"q": "Which *-nis* noun is feminine (*die*)?", "options": ["Ergebnis", "Zeugnis", "Erlaubnis", "Geheimnis", "Gedächtnis"], "answer": 2, "explain": "-nis nouns are mostly das, but *die Erlaubnis* (permission) is one of the exceptions, like die Kenntnis and die Wildnis."}, {"q": "Das ist eine sehr *___* Kette: Sie kostet 5000 Euro.", "options": ["wertvolle", "wertlose", "wertbare", "werthafte", "wertsame"], "answer": 0, "explain": "*-voll* = full of: *wertvoll* = valuable. Its opposite with -los, wertlos, means worthless, which does not fit the price."}, {"q": "Die Wohnungen in München sind fast *___* (impossible to pay for).", "options": ["unbezahlt", "bezahllos", "unzahlbar", "unbezahlig", "unbezahlbar"], "answer": 4, "explain": "Verb stem + *-bar* = can be done, and un- negates it: *unbezahlbar* = unaffordable. unbezahlt = unpaid, a different meaning."}, {"q": "Kannst du das Foto *___* (make it bigger)?", "options": ["größern", "vergrößern", "vergroßen", "großieren", "vergrößen"], "answer": 1, "explain": "ver- + comparative + -n makes a verb: groß → größer → *vergrößern*, lang → verlängern."}, {"q": "Ich habe heute etwas *___* gelernt.", "options": ["Neue", "neues", "Neuen", "Neues", "Neuer"], "answer": 3, "explain": "After *etwas*, *nichts* and *viel* an adjectival noun is neuter, capitalised and ends in -es: *etwas Neues*, nichts Besonderes."}, {"q": "Meine Schwester ist *___* bei einer Bank.", "options": ["Angestellte", "Angestellter", "Angestellten", "Angestellt", "Angestelltin"], "answer": 0, "explain": "*angestellt* → *der / die Angestellte*, an adjectival noun with adjective endings: a woman with no article is *Angestellte*; a man would be Angestellter."}, {"q": "Which compound is spelled correctly?", "options": ["die Tagzeitung", "die Tagenzeitung", "die Tageszeitung", "die Tagszeitung", "die Tagerzeitung"], "answer": 2, "explain": "Some short masculine and neuter nouns take the linking *-es-*: *die Tageszeitung*, die Jahreszeit, das Bundesland."}, {"q": "Für die Prüfung morgen muss ich noch viel *___*.", "options": ["studieren", "studiert", "lehren", "unterrichten", "lernen"], "answer": 4, "explain": "*studieren* = to study at university (Ich studiere Informatik); for homework, vocabulary or an exam use *lernen*. lehren = to teach."}]}
</script>
<script>
(function () {
  var data = JSON.parse(document.getElementById('quiz-data').textContent);
  var KEYS = ['A', 'B', 'C', 'D', 'E'];
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  // Allows *word* in question text to mark the gap or key word
  function rich(node, text) {
    String(text).split(/(\*[^*]+\*)/).forEach(function (part) {
      if (/^\*[^*]+\*$/.test(part)) node.appendChild(el('em', null, part.slice(1, -1)));
      else if (part) node.appendChild(document.createTextNode(part));
    });
    return node;
  }

  var total = data.questions.length;
  // Standalone quiz pages fill their own header; a quiz embedded in a topic page has none
  if (document.getElementById('eyebrow')) {
    document.getElementById('eyebrow').appendChild(document.createTextNode(data.level + ' · ' + total + ' questions'));
    document.getElementById('title').textContent = data.title;
    document.getElementById('crumb').textContent = data.title;
    var dl = document.getElementById('doclink');
    if (data.doc && data.doc.url) dl.href = data.doc.url; else dl.hidden = true;
    var intro = document.getElementById('intro');
    intro.textContent = 'Answer every question, then press Check answers. Reloading the page starts over.';
    if (data.doc && data.doc.url) {
      intro.appendChild(document.createTextNode(' Based on '));
      var a = el('a', null, data.doc.title); a.href = data.doc.url; 
      intro.appendChild(a); intro.appendChild(document.createTextNode('.'));
    }
  }

  // State lives only in memory: reloading the page starts the quiz fresh
  var state = { answers: {}, checked: false };
  var qWrap = document.getElementById('questions');
  function score() { return data.questions.filter(function (q, i) { return state.answers[i] === q.answer; }).length; }
  function render() {
    qWrap.innerHTML = '';
    data.questions.forEach(function (q, i) {
      var card = el('article', 'q card' + (state.checked ? ' locked' : ''));
      var head = el('div', 'qhead');
      head.appendChild(el('span', 'qnum', String(i + 1).padStart(2, '0')));
      head.appendChild(rich(el('div', 'qtext'), q.q));
      card.appendChild(head);
      if (state.checked) {
        var ok = state.answers[i] === q.answer;
        card.appendChild(el('span', 'verdict ' + (ok ? 'ok' : 'no'), ok ? 'Correct' : 'Wrong · answer ' + KEYS[q.answer]));
      }
      var opts = el('div', 'opts'); opts.setAttribute('role', 'radiogroup');
      q.options.forEach(function (o, j) {
        var b = el('button', 'opt'); b.type = 'button'; b.id = 'q' + i + 'o' + j;
        b.setAttribute('role', 'radio'); b.setAttribute('aria-checked', state.answers[i] === j ? 'true' : 'false');
        b.appendChild(el('span', 'key', KEYS[j])); b.appendChild(el('span', 'label', o));
        if (state.checked) {
          if (j === q.answer) b.classList.add('right'); else if (state.answers[i] === j) b.classList.add('wrong');
        } else {
          if (state.answers[i] === j) b.classList.add('sel');
          b.addEventListener('click', function () { state.answers[i] = j; render(); });
        }
        opts.appendChild(b);
        // After checking, the explanation sits directly under the correct option
        if (state.checked && j === q.answer) { var ex = el('div', 'explain'); ex.appendChild(rich(el('p'), q.explain)); opts.appendChild(ex); }
      });
      card.appendChild(opts);
      qWrap.appendChild(card);
    });
    var answered = Object.keys(state.answers).length;
    var prog = document.getElementById('progress'), res = document.getElementById('result'), meter = document.getElementById('meter');
    if (state.checked) {
      var s = score();
      prog.innerHTML = 'Score <strong>' + s + ' / ' + total + '</strong>';
      meter.style.width = (100 * s / total) + '%';
      res.hidden = false; res.innerHTML = '';
      res.appendChild(el('h3', null, s + ' of ' + total + ' correct'));
      var pct = s / total;
      res.appendChild(el('p', null, pct >= 0.9 ? 'Solid. This topic is ready to move on from.' : pct >= 0.7 ? 'Good. Read the explanations under the ones you missed.' : 'Worth another pass through the doc, then try again.'));
    } else {
      prog.innerHTML = 'Answered <strong>' + answered + ' / ' + total + '</strong>';
      meter.style.width = (100 * answered / total) + '%';
      res.hidden = true;
    }
    document.getElementById('check').disabled = state.checked || answered < total;
    document.getElementById('copy').hidden = !state.checked;
  }

  document.getElementById('check').addEventListener('click', function () { state.checked = true; render(); var qs = document.getElementById('quiz'); if (qs && qs.hasAttribute('data-embedded')) qs.scrollIntoView(); else window.scrollTo({ top: 0 }); });
  document.getElementById('reset').addEventListener('click', function () { state = { answers: {}, checked: false }; document.getElementById('copynote').hidden = true; render(); });
  document.getElementById('copy').addEventListener('click', function () {
    var lines = ['Test: ' + data.title + ' — ' + score() + '/' + total];
    data.questions.forEach(function (q, i) {
      var mine = state.answers[i];
      if (mine !== q.answer) lines.push('Q' + (i + 1) + ': chose ' + (mine === undefined ? '—' : KEYS[mine] + ' (' + q.options[mine] + ')') + ', correct ' + KEYS[q.answer] + ' (' + q.options[q.answer] + ')');
    });
    var text = lines.join('\n'), note = document.getElementById('copynote');
    function fallback() { note.hidden = false; note.textContent = text; note.style.whiteSpace = 'pre-wrap'; }
    try {
      navigator.clipboard.writeText(text).then(function () { note.hidden = false; note.textContent = 'Copied. Paste it anywhere to keep a record of your mistakes.'; }, fallback);
    } catch (e) { fallback(); }
  });
  render();
})();

</script>
</body>
</html>
