.explain { margin: -2px 0 4px 18px; padding: 8px 12px; border-left: 2px solid var(--ok); background: var(--ok-soft); border-radius: 0 8px 8px 0; font-size: 14px; }

@media (prefers-reduced-motion: no-preference) { .opt, .btn, .tabs a { transition: background .12s, border-color .12s, box-shadow .12s; } }
/* Full-width layout: pages use the whole window, and long words wrap instead of pushing the page sideways */
:root { --gutter: clamp(16px, 3vw, 40px); }

.score.hi { background: var(--ok-soft); color: var(--ok); }

nd e when it takes an ending: *eure Eltern* (Nom plural, like *keine*)."}, {"q": "Kennst du den *___* Mann dort?", "options": ["alte", "alter", "alten", "altes", "altem"], "answer": 2, "explain": "After *der/den/dem*, the article shows the case, so the adjective is lazy: masculine Akk takes *-en* (only Nom singular and fem/neut Akk take -e)."}, {"q": "Das ist ein *___* Mann.", "options": ["alter", "alte", "alten", "altes", "altem"], "answer": 0, "explain": "Masculine Nom *ein* has no ending, so the adjective carries the signal itself: *ein alter Mann*."}, {"q": "Wir kaufen ein *___* Haus.", "options": ["alte", "alten", "altes", "alter", "altem"], "answer": 2, "explain": "Neuter Akk *ein* has no ending, so the adjective shows the neuter signal *-es*: *ein altes Haus*."}, {"q": "Morgens trinke ich gern *___* Kaffee.", "options": ["schwarzer", "schwarzes", "schwarze", "schwarzen", "schwarzem"], "answer": 3, "explain": "No article, so the adjective takes the der-ending itself; masculine Akk (*den*) gives *schwarzen Kaffee*."}, {"q": "Er hat die Arbeit mit *___* Freude gemacht.", "options": ["große", "großen", "großem", "großes", "großer"], "answer": 4, "explain": "No article after *mit* (Dativ): the adjective takes the feminine Dativ der-ending *-er* (like *der Frau*)."}, {"q": "Ich gebe *___* Mann das Buch.", "options": ["den", "der", "des", "dem", "das"], "answer": 3, "explain": "*geben* takes Dativ for the person and Akk for the thing: *dem Mann das Buch*."}, {"q": "Ich bin gerade in *___* Stadt.", "options": ["die", "den", "dem", "der", "das"], "answer": 3, "explain": "*in* is a two-way preposition: location (wo?) takes Dativ, and Stadt is feminine, so *in der Stadt*."}, {"q": "Wir bleiben wegen *___* Wetters zu Hause.", "options": ["dem", "des", "das", "der", "den"], "answer": 1, "explain": "*wegen* takes the Genitiv in writing; neuter Genitiv is *des* + noun -s: *wegen des Wetters*."}, {"q": "Ich gehe heute *___* Arzt.", "options": ["zur", "ins", "zum", "im", "beim"], "answer": 2, "explain": "*zu* + *dem* contracts to *zum*; *zur* is only for feminine (zu der), and *beim* is location, not movement."}, {"q": "Ich fahre jeden Tag mit *___* Bus zur Arbeit.", "options": ["den", "der", "das", "des", "dem"], "answer": 4, "explain": "Means of transport take *mit* + Dativ, and der Bus gives *mit dem Bus*."}, {"q": "Ich kaufe *___* Pullover hier.", "options": ["dieser", "diesem", "dieses", "diesen", "diese"], "answer": 3, "explain": "*dieser* takes the same endings as *der*; masculine Akk *den* gives *diesen Pullover*."}, {"q": "Das ist die Tasche *___* Freundin.", "options": ["meine", "meinem", "meines", "meinen", "meiner"], "answer": 4, "explain": "Feminine Genitiv is *der* → *einer/meiner*: *die Tasche meiner Freundin*."}, {"q": "Peter ruft *___* Mutter an.", "options": ["ihre", "seine", "seinen", "seiner", "ihr"], "answer": 1, "explain": "The owner is Peter (he), so *sein*; Mutter is feminine Akk, so *seine*. The owner, not the object, picks sein or ihr."}, {"q": "Frau Schmidt, ist das *___* Schlüssel?", "options": ["Ihr", "Ihre", "Ihren", "Ihrem", "Ihres"], "answer": 0, "explain": "Formal *Ihr* works like *kein*; masculine Nominativ (*das ist …*) has no ending: *Ihr Schlüssel*."}, {"q": "Wir besuchen morgen *___* Großeltern.", "options": ["unser", "unserer", "unsere", "unseren", "unserem"], "answer": 2, "explain": "Possessives take *kein*-endings; plural Akkusativ is *-e*: *unsere Großeltern* (like *keine*)."}, {"q": "Ich wohne in einem *___* Haus.", "options": ["kleines", "kleine", "kleinem", "kleinen", "kleiner"], "answer": 3, "explain": "*einem* already shows neuter Dativ, so the adjective takes the lazy *-en*: *in einem kleinen Haus*."}, {"q": "Die *___* Lehrerin ist sehr nett.", "options": ["neuen", "neuer", "neues", "neuem", "neue"], "answer": 4, "explain": "After *die* in the Nominativ singular the adjective takes *-e*: *die neue Lehrerin*."}, {"q": "*___* Wasser ist gesund.", "options": ["Kaltes", "Kalter", "Kalte", "Kalten", "Kaltem"], "answer": 0, "explain": "No article, so the adjective carries the der-word signal; neuter Nominativ (*das*) gives *kaltes Wasser*."}, {"q": "Ich koche gern mit *___* Tomaten.", "options": ["frische", "frischen", "frischer", "frischem", "frisches"], "answer": 1, "explain": "No article after *mit* (Dativ plural *den*), so the adjective takes *-en*: *mit frischen Tomaten*."}, {"q": "Ich danke *___* Lehrer für die Hilfe.", "options": ["den", "der", "dem", "des", "die"], "answer": 2, "explain": "*danken* takes a Dativ object, masculine: *dem Lehrer*."}, {"q": "Ich habe ein Geschenk für *___* Vater.", "options": ["meinem", "mein", "meiner", "meinen", "meines"], "answer": 3, "explain": "*für* always takes Akkusativ; masculine *mein* becomes *meinen*: *für meinen Vater*."}, {"q": "Am Abend gehen wir *___* Kino.", "options": ["im", "in den", "in dem", "aufs", "ins"], "answer": 4, "explain": "*gehen* is movement (wohin?), so *in* + Akk, neuter: *in das* → *ins Kino*; *im* is location (in dem)."}]}

    document.getElementById('crumb').textContent = L(data, 'title');
    var dl = document.getElementById('doclink');
    if (data.doc && data.doc.url) dl.href = data.doc.url; else dl.hidden = true;
    var intro = document.getElementById('intro');
    intro.textContent = 'Answer every question, then press Check answers. Reloading the page starts over.';
    if (data.doc && data.doc.url) {
      intro.appendChild(document.createTextNode(' Based on '));
      var a = el('a', null, L(data.doc, 'title')); a.href = data.doc.url; 
      intro.appendChild(a); intro.appendChild(document.createTextNode('.'));
    }
  }

  // State lives only in memory: reloading the page starts the quiz fresh
  var state = { answers: {}, checked: false };
  var qWrap = document.getElementById('questions');
  function score() { return data.questions.filter(function (q, i) { return state.answers[i] === q.answer; }).length; }
  function render() {
    qWrap.innerHTML = '';
    data.questions.forEach(function (q, i) {
      var card = el('article', 'q card' + (state.checked ? ' locked' : ''));
      var head = el('div', 'qhead');
      head.appendChild(el('span', 'qnum', String(i + 1).padStart(2, '0')));
      head.appendChild(rich(el('div', 'qtext'), L(q, 'q')));
      card.appendChild(head);
      if (state.checked) {
        var ok = state.answers[i] === q.answer;
        card.appendChild(el('span', 'verdict ' + (ok ? 'ok' : 'no'), ok ? 'Correct' : 'Wrong · answer ' + KEYS[q.answer]));
      }
      var opts = el('div', 'opts'); opts.setAttribute('role', 'radiogroup');
      L(q, 'options').forEach(function (o, j) {
        var b = el('button', 'opt'); b.type = 'button'; b.id = 'q' + i + 'o' + j;
        b.setAttribute('role', 'radio'); b.setAttribute('aria-checked', state.answers[i] === j ? 'true' : 'false');
        b.appendChild(el('span', 'key', KEYS[j])); b.appendChild(el('span', 'label', o));
        if (state.checked) {
          if (j === q.answer) b.classList.add('right'); else if (state.answers[i] === j) b.classList.add('wrong');
        } else {
          if (state.answers[i] === j) b.classList.add('sel');
          b.addEventListener('click', function () { state.answers[i] = j; render(); });
        }
        opts.appendChild(b);
        // After checking, the explanation sits directly under the correct option
        if (state.checked && j === q.answer) { var ex = el('div', 'explain'); ex.appendChild(rich(el('p'), L(q, 'explain'))); opts.appendChild(ex); }
      });
      card.appendChild(opts);
      qWrap.appendChild(card);
    });
    var answered = Object.keys(state.answers).length;
    var prog = document.getElementById('progress'), res = document.getElementById('result'), meter = document.getElementById('meter');
    if (state.checked) {
      var s = score();
      prog.innerHTML = 'Score' + ' <strong>' + s + ' / ' + total + '</strong>';
      meter.style.width = (100 * s / total) + '%';
      res.hidden = false; res.innerHTML = '';
      res.appendChild(el('h3', null, s + ' of ' + total + ' correct'));
      var pct = s / total;
      res.appendChild(el('p', null, pct >= 0.9 ? 'Solid. This topic is ready to move on from.' : pct >= 0.7 ? 'Good. Read the explanations under the ones you missed.' : 'Worth another pass through the topic, then try again.'));
    } else {
      prog.innerHTML = 'Answered' + ' <strong>' + answered + ' / ' + total + '</strong>';
      meter.style.width = (100 * answered / total) + '%';
      res.hidden = true;
    }
    document.getElementById('check').disabled = state.checked || answered < total;
    document.getElementById('copy').hidden = !state.checked;
  }

  document.getElementById('check').addEventListener('click', function () { state.checked = true; render(); saveRes(score(), total); var qs = document.getElementById('quiz'); if (qs && qs.hasAttribute('data-embedded')) qs.scrollIntoView(); else window.scrollTo({ top: 0 }); });
  document.getElementById('reset').addEventListener('click', function () { state = { answers: {}, checked: false }; document.getElementById('copynote').hidden = true; render(); });
  document.getElementById('copy').addEventListener('click', function () {
    var lines = ['Test: ' + L(data, 'title') + ' — ' + score() + '/' + total];
    data.questions.forEach(function (q, i) {
      var mine = state.answers[i];
      if (mine !== q.answer) var op = L(q, 'options'); lines.push('Q' + (i + 1) + ': chose ' + (mine === undefined ? '—' : KEYS[mine] + ' (' + op[mine] + ')') + ', correct ' + KEYS[q.answer] + ' (' + op[q.answer] + ')');
    });
    var text = lines.join('\n'), note = document.getElementById('copynote');
    function fallback() { note.hidden = false; note.textContent = text; note.style.whiteSpace = 'pre-wrap'; }
    try {
      navigator.clipboard.writeText(text).then(function () { note.hidden = false; note.textContent = 'Copied. Paste it anywhere to keep a record of your mistakes.'; }, fallback);
    } catch (e) { fallback(); }
  });
  render();
})();

</script>
</body>
</html>
